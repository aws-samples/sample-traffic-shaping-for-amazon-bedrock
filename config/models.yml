schema_version: 1

# Account-effective quota snapshot used to seed and review model configuration.
# Refresh deliberately; load tests should not fetch quota state implicitly.
snapshot:
  captured_on: "2026-08-04"
  aws_profile: your-profile
  aws_region: us-east-1
  sources:
    - bedrock:list-foundation-models
    - bedrock:list-inference-profiles
    - service-quotas:list-service-quotas
  notes:
    - Quotas are account- and region-specific and can change after quota approvals.
    - Runtime TPM combines input and output after applying output-token burndown.
    - Mantle enforces separate input and output TPM quotas and has no RPM quota.

defaults:
  duration_seconds: 60
  pattern: at_quota
  route: runtime-us
  aws_region: us-east-1

models:
  nova-2-lite:
    display_name: Amazon Nova 2 Lite
    provider: amazon
    lifecycle: active
    retained_for: historical-baseline
    default_route: runtime-us
    estimation:
      bytes_per_input_token: 4.0
      output_token_burndown: 1.0
    routes:
      runtime-us:
        enabled: true
        client_supported: true
        backend: runtime
        api_style: converse
        model_id: us.amazon.nova-2-lite-v1:0
        base_model_id: amazon.nova-2-lite-v1:0
        inference_scope: us-cross-region
        quotas:
          combined_tpm: 8000000
          rpm: 2000
        quota_codes:
          combined_tpm: L-C6F5908D
          rpm: L-F06F1187
      runtime-global:
        enabled: true
        client_supported: true
        backend: runtime
        api_style: converse
        model_id: global.amazon.nova-2-lite-v1:0
        base_model_id: amazon.nova-2-lite-v1:0
