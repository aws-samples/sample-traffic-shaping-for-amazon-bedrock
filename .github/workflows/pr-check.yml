name: PR Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "18"

      # Floor set by the aws-cdk-lib pin in requirements.txt, not chosen freely -
      # see the README prerequisites table and CONTRIBUTING.md.
      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2.1139.0

      - name: Install Python dependencies
        run: pip install -r requirements.lock

      - name: Unit tests (pytest)
        run: pytest

      - name: Offline algorithm simulations
        run: |
          make test-queue-processor-sim
          make test-budget-manager-sim

      - name: Detect infrastructure changes
        id: infra-changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            infra:
              - 'infrastructure/**'
              - 'requirements*.txt'
              - 'cdk.json'

      # cdk-nag's AwsSolutionsChecks Aspect is wired in infrastructure/app.py;
      # a security violation fails synth. Must run from repo root - cdk.json
      # lives there, not under infrastructure/.
      - name: CDK synth (cdk-nag security gate)
        if: steps.infra-changes.outputs.infra == 'true'
        run: cdk synth
